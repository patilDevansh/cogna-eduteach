<script>
/* Theme before first paint: the student's own choice if they made one, else the device's setting. */
(function () {
  var t = null;
  try { t = window.localStorage.getItem("cogna-theme"); } catch (e) { /* ignore */ }
  if (t !== "dark" && t !== "light") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>

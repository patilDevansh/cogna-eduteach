<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Area Lab</title>
<style>html,body{margin:0;height:100%;background:#f4f7f3}canvas{display:block;width:100vw;height:100vh;outline:none}</style></head>
<body><canvas id="c" tabindex="0"></canvas>
<script src="https://cdn.jsdelivr.net/npm/@rive-app/webgl2@2.52.0/rive.js"></script>
<script>
var r = new rive.Rive({ src: "area-module.riv", canvas: document.getElementById("c"), autoplay: true, stateMachines: "State Machine 1",
  layout: new rive.Layout({ fit: "contain", alignment: "center" }), onLoad: function () { r.resizeDrawingSurfaceToCanvas(); } });
addEventListener("resize", function () { r.resizeDrawingSurfaceToCanvas(); });
</script></body></html>

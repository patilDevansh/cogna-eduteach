services:
  postgres:
    image: postgres:16-alpine
    container_name: cogna-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cogna
    volumes:
      - cogna_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cogna"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cogna_pg_data:

name: Test gates

on:
  push:
    branches: [feat/mvp-2.0-build, feat/lotus-new-architecture, main, master, codex/2026-08-12-improvements]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cogna
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cogna?schema=public
      ALLOW_PENDING_REVIEW_QUESTIONS: "true"
      LIVE_AGENTIC_GENERATE: "true"
      LIVE_AGENTIC_SERVE_GENERATED: "false"
      # CI-only test values: sign student sessions, and let the scenario CLI call ops routes.
      COGNA_SESSION_SECRET: ci-only-session-secret
      COGNA_JOB_WORKER_TOKEN: ci-only-worker-token
      LOTUS_AUTONOMOUS_EVAL_TOKEN: ci-only-lotus-eval-token
      LOTUS_E2E_FAKE_MODEL: "true"
      LOTUS_E2E_DISABLE_QUESTION_BANK: "true"
      LOTUS_CODE_BUILT_QUESTIONS: "true"
      ALLOW_DEMO_STUDENT_SESSIONS: "true"
    steps:
      - uses: actions/checkout@v4
      # No version here: the action reads "packageManager" from package.json (pnpm@9.15.0).
      # Pinning it in both places makes the action refuse to run.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      # The apps import these workspace packages from their built dist/ (gitignored), so build all three.
      - run: pnpm --filter @cogna/shared build
      - run: pnpm --filter @cogna/database generate
      - run: pnpm --filter @cogna/database build
      - run: pnpm --filter @cogna/lesson-video build
      # Build the database from the real migrations (not db push), then fail if they don't match the schema.
      - run: pnpm db:migrate:deploy
      - run: pnpm --filter @cogna/database migrate:check
      - run: pnpm db:seed
      - name: Start API
        run: |
          pnpm --filter @cogna/api build
          pnpm --filter @cogna/api start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health && break
            sleep 2
          done
      - name: Start Web
        run: |
          pnpm --filter @cogna/web build
          pnpm --filter @cogna/web start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ >/dev/null && break
            sleep 2
          done
      - name: Golden + content
        run: pnpm test:golden && pnpm test:content
      - name: Scenario E2E (incl. live-gen)
        run: pnpm test:scenario:all
      - name: UI smoke
        run: pnpm test:smoke:ui:mvp2
      - name: Lotus live answer-route personas and browser reports
        run: node --import tsx tests/e2e/lotus-remediation-gates.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotus-remediation-evidence
          path: test-results/lotus-remediation
          if-no-files-found: error
      - name: Playwright UI (may SKIP playwright deps)
        run: pnpm test:ui:e2e
        continue-on-error: true
